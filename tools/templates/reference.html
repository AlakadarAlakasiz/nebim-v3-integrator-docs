<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nebim V3 · 238 model API rehberi</title>
<style>
:root{--ink:#192e33;--muted:#60757a;--line:#dce5e5;--green:#176d5b;--wash:#f4f7f6;--orange:#a45d16}*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#fff}button,input{font:inherit}button{cursor:pointer}header{height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding:0 28px;background:#fff;position:sticky;top:0;z-index:5}.brand{font-weight:750;font-size:22px;letter-spacing:-.7px}.brand small{font-weight:450;color:var(--muted);font-size:14px;margin-left:16px}.tag{background:#e7f2ed;color:var(--green);border-radius:6px;font-size:12px;padding:5px 9px;font-weight:650}.layout{display:grid;grid-template-columns:310px minmax(0,1fr)}aside{position:sticky;top:76px;height:calc(100vh - 76px);overflow:auto;border-right:1px solid var(--line);background:var(--wash);padding:20px 14px}.search{width:100%;border:1px solid #c6d5d2;background:#fff;border-radius:7px;padding:11px 12px;outline-color:var(--green)}#count{font-size:12px;color:var(--muted);margin:10px 2px}.model{width:100%;border:0;text-align:left;background:none;padding:11px 10px;border-radius:7px;display:flex;gap:11px;line-height:1.35;color:var(--ink)}.model:hover{background:#e9efec}.model.active{background:#dcebe4;color:#134e42}.num{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:26px;padding-top:3px}.model strong{display:block;font-size:13px;word-break:break-word}.model small{font-size:12px;color:var(--muted)}main{padding:34px 42px 80px;max-width:1250px;min-width:0}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-size:11px;font-weight:750;color:var(--green);margin:0 0 10px}h1{font-size:34px;line-height:1.15;letter-spacing:-1px;margin:0 0 16px;overflow-wrap:anywhere}h2{font-size:21px;letter-spacing:-.4px;margin:32px 0 12px}h3{font-size:16px;margin:24px 0 9px}p{margin:8px 0 15px}.muted,.note{color:var(--muted);font-size:13px}.notice{padding:14px 17px;border-left:3px solid #cda44a;background:#fcf8ef;border-radius:0 5px 5px 0;font-size:13px;margin:20px 0}.status{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.status span{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:5px 9px}.endpoint{background:#eef5f1;border:1px solid #d3e4db;padding:13px 16px;border-radius:7px;font-family:ui-monospace,Consolas,monospace;overflow-wrap:anywhere;margin:24px 0 10px}.verb{font-family:system-ui,sans-serif;font-weight:750;color:var(--green);margin-right:14px}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:26px 0 22px}.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 0;color:var(--muted);font-size:13px}.tabs button.active{border-color:var(--green);color:var(--green);font-weight:700}.codebox{border:1px solid #dce4e1;border-radius:8px;overflow:hidden;margin:12px 0 22px}.codehead{background:#f0f4f2;padding:7px 13px;display:flex;justify-content:space-between;align-items:center;font:12px system-ui;color:var(--muted)}.copy{border:1px solid #ccd9d3;background:white;border-radius:4px;padding:3px 9px;font-size:11px;color:var(--green)}pre{margin:0;padding:18px 20px;overflow:auto;font:13px/1.65 ui-monospace,Consolas,monospace;tab-size:2;background:#fbfcfb;max-height:600px}code{font:12px ui-monospace,Consolas,monospace;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;background:#f0f4f2;color:#53696b;font-weight:650;position:sticky;top:76px}th,td{border-bottom:1px solid var(--line);padding:10px 9px;vertical-align:top}td:first-child{font-weight:600;overflow-wrap:anywhere}td a{color:var(--green)}.tablewrap{overflow:auto}a{color:var(--green);text-underline-offset:3px}.links{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin:15px 0}.pill{border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--green);padding:7px 10px;font-size:12px}#typepanel{padding:20px;border:1px solid var(--line);border-radius:8px;margin:20px 0}.error{border-top:1px solid var(--line);padding:15px 0}.error strong{font-size:14px}.error .tag{margin-right:8px}.empty{padding:18px 8px;color:var(--muted);font-size:13px}footer{border-top:1px solid var(--line);font-size:12px;color:var(--muted);padding-top:18px;margin-top:36px}details{font-size:13px;margin:14px 0}summary{cursor:pointer;color:var(--green)}@media(max-width:900px){.layout{grid-template-columns:235px minmax(0,1fr)}main{padding:28px 22px}.brand small{display:none}}@media(max-width:620px){header{height:65px;padding:0 16px}.layout{display:block}aside{position:static;height:240px;border-bottom:1px solid var(--line);padding:12px}main{padding:25px 16px}h1{font-size:27px}th{position:static}.tabs{gap:15px;overflow:auto}}
</style></head><body>
<header><div class="brand">Nebim V3 <small>API kullanım rehberi · 25.4.1.0</small></div><span class="tag">238 model · çevrimdışı</span></header>
<div class="layout"><aside><label for="search" class="note">Model, kod, grup veya alan ara</label><input id="search" class="search" placeholder="Örn. 149, fatura, CurrAccCode" autocomplete="off"><div id="count"></div><nav id="nav" aria-label="Modeller"></nav></aside><main id="content"></main></div>
<script type="application/json" id="catalog">__DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('catalog').textContent),$=id=>document.getElementById(id);
let selected=+(location.hash.slice(1))||3,tab='guide';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pretty=v=>JSON.stringify(v,null,2);
function code(v,label){return `<div class="codebox"><div class="codehead"><span>${esc(label)}</span><button class="copy" type="button">Kopyala</button></div><pre>${esc(pretty(v))}</pre></div>`}
function typeTarget(f){if(f.kind==='nested-collection'){if(f.type.includes('<'))return f.type.slice(f.type.indexOf('<')+1,-1);return D.types[f.type]?.element}return f.type}
function fields(type){const t=D.types[type];if(!t)return '<p class="notice">Bu dinamik tipin sabit alan şeması çözülemedi. Özel işlem gövdesi esas alınır.</p>';if(t.enum)return code(t.values,'Enum değerleri');if(t.isCollection){const el=t.element;return `<p>Koleksiyon JSON’da dizi olarak taşınır. Somut satır: ${D.types[el]?`<a href="#" data-type="${esc(el)}">${esc(el)}</a>`:'çözülemedi'}.</p>`}return `<div class="tablewrap"><table><thead><tr><th>Alan</th><th>Tür / alt nesne</th><th>Giriş</th><th>Çıkış</th><th>Anahtar</th><th>Uzunluk</th></tr></thead><tbody>${Object.values(t.fields).map(f=>{const target=typeTarget(f);return `<tr><td>${esc(f.name)}</td><td><code>${esc(f.type)}</code>${D.types[target]?`<br><a href="#" data-type="${esc(target)}">Tip ayrıntısını aç →</a>`:''}</td><td>${esc(f.input)}</td><td>${esc(f.output)}</td><td>${f.key?'evet':'—'}</td><td>${f.maxLength??'—'}</td></tr>`}).join('')}</tbody></table></div>`}
function renderNav(){const q=$('search').value.toLocaleLowerCase('tr-TR'),filtered=D.models.filter(m=>`${m.code} ${m.name} ${m.title} ${m.family} ${Object.keys(D.types[m.fieldType]?.fields||{}).join(' ')}`.toLocaleLowerCase('tr-TR').includes(q));$('count').textContent=`${filtered.length} / 238 model`; $('nav').innerHTML=filtered.length?filtered.map(m=>`<button class="model ${m.code===selected?'active':''}" data-model="${m.code}"><span class="num">${String(m.code).padStart(3,'0')}</span><span><strong>${esc(m.name)}</strong><small>${esc(m.title)}</small></span></button>`).join(''):'<p class="empty">Eşleşen model bulunamadı.</p>'}
function render(){
const m=D.models.find(m=>m.code===selected)||D.models[0];selected=m.code;let body='';
if(tab==='guide')body=`<h2>Model tanıtımı</h2><p>${esc(m.description)}</p><p class="note">Somut kök: <code>${esc(m.rootType||'Özel / dinamik işlem')}</code></p>${m.lineTypes.length?`<p class="note">Somut satır seçenekleri: ${m.lineTypes.map(esc).join(', ')}</p>`:''}<h2>Örnek request</h2><p class="note">Kaynak/metadata şablonu; yer tutucular ve kurulum kodları doldurulmalı. Tam zorunlu alan listesi değildir.</p>${code(m.request,'application/json · request')}<h2>Örnek response</h2><p class="note">${esc(m.responseNote)}</p>${code(m.response,'application/json · temsili başarı')}`;
if(tab==='read')body=`<h2>GetModel</h2><p>${esc(m.keyNote)}</p>${m.getRequest?`<div class="endpoint"><span class="verb">POST</span>/IntegratorService/GetModel/{token}</div>${code(m.getRequest,'Anahtar gövdesi — model doğrulaması gerekir')}<h2>Delete</h2><p>Aynı iş anahtarı /IntegratorService/Delete/{token} için örnektir. Kaynak silme, kilit, lisans/yetki ve ilişki kuralları ayrıca geçerlidir; işlem veri değiştirir.</p>`:''}<h2>NewModel</h2><div class="endpoint"><span class="verb">GET</span>/IntegratorService/NewModel?modelType=${m.code}</div>${code({ModelType:m.code},'Yalnız model kodu; tam DTO değildir')}`;
if(tab==='fields')body=`<h2>Giriş ve çıkış sözleşmesi</h2><p class="note">true: sözleşmede var; false: yok; diğer: koşullu. Anahtar metadata bilgisidir; uzunluk boşsa bilinmiyor demektir. Zorunluluk ve varsayılan bu tablodan çıkarılmaz.</p>${m.special?'<p class="notice">Özel işlemde dinamik gövde esastır. Model163 yalnız baz header alanlarını;113 seçilmiş CustomerAttribute örneğini gösterir. Sabit tablo bütün özel alanları kapsamayabilir.</p>':''}${fields(m.fieldType)}<div id="typepanel" hidden></div>`;
if(tab==='errors')body=`<h2>Hatalar ve istemci davranışı</h2><p class="note">Özgün global hata, kuyruk ve binder yolları ayrı değerlendirilir. HTTP200 içinde hata olabilir; ExceptionMessage/Exception/StatusCode birlikte kontrol edilir. Aşağıdaki liste bütün lisans/iş kuralı hatalarının eksiksiz canlı kataloğu değildir.</p>${D.errors.map(e=>`<div class="error"><strong><span class="tag">${esc(e.status)}</span>${esc(e.title)}</strong><p>${esc(e.meaning)}</p><p class="note">${esc(e.action)}</p><details><summary>Temsili yanıt biçimi</summary>${['async','queue','queue-missing'].includes(e.id)?`<p class="note">Kuyruk yolu düz metin döndürebilir; aşağıdaki gösterim JSON zarfı değildir.</p><div class="codebox"><pre>${esc(e.message)}</pre></div>`:code({ModelType:0,ExceptionMessage:e.message,StackTrace:'',ErrorSource:'NebimV3IntegratorService',StatusCode:400},'Örnek global hata zarfı; HTTP durumu ayrıca kontrol edilir')}</details></div>`).join('')}<p class="notice">Mesajlar temsili olabilir. JSON Detail içinde de && bulunabilir; yalnız metin bölmeyle hata sayısını kesinleştirmeyin. Belirsiz bir yazmayı otomatik tekrar göndermeyin.</p>`;
$('content').innerHTML=`<p class="eyebrow">Model ${m.code} / ${esc(m.family)}</p><h1>${esc(m.title)}</h1><p class="muted">${esc(m.name)} · özgün Nebim V3 Entegratör ${esc(D.referenceVersion)}</p><div class="notice">Bu rehber yalnız özgün Nebim V3 Entegratör HTTP sözleşmesini belgeler. Örnekler kaynak/metadata şablonudur; canlı başarı yakalaması değildir. Üretim çevrimdışıdır.</div><div class="links"><a href="MODELS.md">Model dizini</a><a href="TYPES.md">2.325 tip</a><a href="Nebim-V3-238-model.postman_collection.json" download>Postman koleksiyonu</a><a href="Nebim-V3.postman_environment.json" download>Postman ortamı</a><a href="validation.json">Doğrulama raporu</a></div><div class="endpoint"><span class="verb">POST</span>{{baseUrl}}${esc(m.path.replace('{token}','{{token}}'))}</div><div class="tabs">${[['guide','Tanıtım & örnekler'],['read','Okuma & silme'],['fields','Alanlar & tipler'],['errors','Hatalar']].map(([id,title])=>`<button class="${tab===id?'active':''}" data-tab="${id}">${title}</button>`).join('')}</div>${body}<footer>1–238 tam kapsam · 0/None sentinel · Sürüm ve kurulum kuralları geçerlidir<br>Parola/token ortamda doldurulur. Bu sayfa backend’e bağlanmaz.</footer>`;
renderNav();}
$('search').addEventListener('input',renderNav);
document.addEventListener('click',async e=>{const model=e.target.closest('[data-model]'),t=e.target.closest('[data-tab]'),type=e.target.closest('[data-type]'),copy=e.target.closest('.copy');if(model){selected=+model.dataset.model;tab='guide';history.replaceState(null,'','#'+selected);render();window.scrollTo(0,0)}if(t){tab=t.dataset.tab;render()}if(type){e.preventDefault();const panel=$('typepanel');if(panel){const name=type.dataset.type;panel.hidden=false;panel.innerHTML=`<h3>${esc(name)}</h3>${fields(name)}`;panel.scrollIntoView({block:'start',behavior:'smooth'})}}if(copy){try{await navigator.clipboard.writeText(copy.closest('.codebox').querySelector('pre').textContent);copy.textContent='Kopyalandı'}catch(_){copy.textContent='Metni seçip kopyalayın'}}});
render();
</script></body></html>
